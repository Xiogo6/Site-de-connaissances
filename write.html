<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Ecrire — Atlas</title>
    <meta name="theme-color" content="#edf0eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Écrire" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./write.webmanifest" />
    <link rel="apple-touch-icon" href="./write-icon-180.png" />
    <!-- Meme parti pris que voice.html : deux feuilles communes, le reste ici. -->
    <link rel="stylesheet" href="./styles/tokens.css?v=116" />
    <link rel="stylesheet" href="./styles/base.css?v=116" />
    <style>
      /* Preset Atelier, recopie de voice.html (qui le recopie de themes.css). */
      :root {
        --surface: rgba(247, 248, 242, 0.94);
        --line: rgba(55, 78, 77, 0.14);
        --line-strong: rgba(55, 78, 77, 0.3);
        --text: #253738;
        --text-soft: #5f7370;
        --accent: #4f7784;
        --accent-strong: #284f5d;
        --shadow: 0 24px 58px rgba(53, 73, 70, 0.13);
        color-scheme: light;
      }

      body {
        background:
          radial-gradient(circle at 10% 6%, rgba(108, 143, 128, 0.2), transparent 30%),
          radial-gradient(circle at 90% 16%, rgba(86, 120, 143, 0.18), transparent 32%),
          linear-gradient(145deg, #f1f3ed 0%, #e8ece7 52%, #e0e6e2 100%);
        display: flex;
        justify-content: center;
        padding: max(18px, env(safe-area-inset-top)) 16px
          max(24px, env(safe-area-inset-bottom));
      }

      [hidden] {
        display: none !important;
      }

      .ecrit {
        display: flex;
        flex-direction: column;
        gap: 18px;
        max-width: 560px;
        width: 100%;
      }

      .ecrit-tete {
        align-items: baseline;
        display: flex;
        gap: 12px;
        justify-content: space-between;
      }

      .ecrit-tete h1 {
        font-family: var(--content-font);
        font-size: 1.35rem;
        margin: 0;
      }

      .ecrit-session {
        color: var(--text-soft);
        font-size: 0.78rem;
        margin: 0;
        text-align: right;
      }

      /* ---------- la saisie ---------- */

      .ecrit-saisie {
        display: grid;
        gap: 10px;
      }

      .ecrit-saisie input,
      .ecrit-saisie textarea {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        color: var(--text);
        font: inherit;
        padding: 12px 14px;
        width: 100%;
      }

      .ecrit-saisie input {
        font-weight: 600;
        min-height: 48px;
      }

      /* 16px minimum : en dessous, Safari zoome sur le champ au focus. */
      .ecrit-saisie textarea {
        font-size: 1rem;
        line-height: 1.5;
        min-height: 40vh;
        resize: vertical;
      }

      .ecrit-actions {
        align-items: center;
        display: flex;
        gap: 12px;
      }

      .ecrit-envoyer {
        background: var(--accent);
        border: none;
        border-radius: 999px;
        color: #f8fbfa;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        min-height: 50px;
        padding: 0 26px;
      }

      .ecrit-envoyer:disabled {
        opacity: 0.45;
      }

      .ecrit-statut {
        color: var(--text-soft);
        font-size: 0.85rem;
        margin: 0;
      }

      .ecrit-statut.est-erreur {
        color: #b4452a;
      }

      /* ---------- file d'attente ---------- */

      .ecrit-file h2 {
        font-size: 0.95rem;
        margin: 0 0 8px;
      }

      .ecrit-liste {
        display: grid;
        gap: 8px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .ecrit-liste li {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        display: flex;
        font-size: 0.85rem;
        gap: 10px;
        justify-content: space-between;
        padding: 10px 12px;
      }

      .ecrit-liste li span:last-child {
        color: var(--text-soft);
        white-space: nowrap;
      }

      /* ---------- configuration ---------- */

      .ecrit-config {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        display: grid;
        gap: 10px;
        padding: 14px;
      }

      .ecrit-config h2 {
        font-size: 1rem;
        margin: 0;
      }

      .ecrit-config label {
        display: grid;
        font-size: 0.8rem;
        gap: 4px;
      }

      .ecrit-config input {
        background: transparent;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        color: var(--text);
        font-size: 1rem;
        min-height: 44px;
        padding: 0 12px;
        width: 100%;
      }

      .ecrit-config button {
        background: var(--accent);
        border: none;
        border-radius: 999px;
        color: #f8fbfa;
        cursor: pointer;
        font-weight: 600;
        min-height: 44px;
        padding: 0 18px;
      }

      .ecrit-config p {
        color: var(--text-soft);
        font-size: 0.78rem;
        margin: 0;
      }

      .ecrit-pied {
        border-top: 1px solid var(--line);
        color: var(--text-soft);
        display: flex;
        font-size: 0.8rem;
        gap: 16px;
        padding-top: 14px;
      }

      .ecrit-pied a {
        color: var(--accent-strong);
      }
    </style>
  </head>
  <body>
    <main class="ecrit">
      <header class="ecrit-tete">
        <h1>Nouvelle page</h1>
        <p id="write-session" class="ecrit-session">Session : verification...</p>
      </header>

      <!-- Le texte est garde en brouillon a chaque frappe : une page fermee par
           erreur, ou tuee par iOS en arriere-plan, rouvre avec ce qui avait ete
           tape. -->
      <section class="ecrit-saisie">
        <input id="write-title" type="text" placeholder="Titre (facultatif)"
               autocomplete="off" enterkeyhint="next" />
        <textarea id="write-body" placeholder="Ecris ici. La page arrivera dans Atlas, dossier Notes rapides."
                  autofocus></textarea>
        <div class="ecrit-actions">
          <button id="write-send" class="ecrit-envoyer" type="button" disabled>Envoyer</button>
          <p id="write-status" class="ecrit-statut" role="status"></p>
        </div>
      </section>

      <section id="write-file" class="ecrit-file" hidden>
        <h2>En attente d'envoi</h2>
        <ul id="write-list" class="ecrit-liste"></ul>
      </section>

      <!-- Stockage cloisonne par icone sur iOS : cette page a sa propre session,
           saisie une fois. Aucune cle Gemini ici, le texte part tel quel. -->
      <section id="write-config" class="ecrit-config" hidden>
        <h2>Session Supabase</h2>
        <label>
          <span>Adresse e-mail</span>
          <input id="write-auth-email" type="email" autocomplete="username" />
        </label>
        <label>
          <span>Mot de passe</span>
          <input id="write-auth-password" type="password" autocomplete="current-password" />
        </label>
        <button id="write-auth-submit" type="button">Se connecter</button>
        <p id="write-auth-status"></p>
      </section>

      <footer class="ecrit-pied">
        <a href="./index.html">Ouvrir Atlas</a>
        <a href="./voice.html">Dicter</a>
      </footer>
    </main>

    <script src="./scripts/config.js?v=116"></script>
    <script src="./scripts/auth.js?v=116"></script>
    <script src="./scripts/write.js?v=116"></script>
  </body>
</html>
