<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Dictee — Atlas</title>
    <meta name="theme-color" content="#edf0eb" />
    <!-- Le premier est la norme, le second est deprecie mais reste lu par iOS. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dicter" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./voice.webmanifest" />
    <!-- iOS ignore les icones SVG pour l'ecran d'accueil : sans ce PNG,
         le raccourci porterait une capture de la page. -->
    <link rel="apple-touch-icon" href="./voice-icon-180.png" />
    <!-- Deux feuilles seulement, 2,6 Ko. Le reste du style est ci-dessous :
         charger layout, components, features et themes pour un ecran unique
         couterait plus cher que de l'ecrire a la main. -->
    <link rel="stylesheet" href="./styles/tokens.css?v=108" />
    <link rel="stylesheet" href="./styles/base.css?v=108" />
    <style>
      /*
        Preset Atelier, recopie de styles/themes.css.

        La page ne charge pas themes.css : quarante-huit kilooctets pour un
        seul ecran, dont on n'utiliserait qu'une dizaine de lignes. Ce sont ces
        lignes-la, et rien d'autre.

        Contrepartie : cette page ne suit plus le theme choisi dans Atlas, elle
        est en Atelier quoi qu'il arrive. Pour un outil qu'on ouvre dix
        secondes, une apparence stable vaut mieux qu'une apparence qui depend
        d'un reglage fait ailleurs.

        Si le preset Atelier change un jour dans themes.css, ces valeurs ne
        suivront pas toutes seules.
      */
      :root {
        --surface: rgba(247, 248, 242, 0.94);
        --line: rgba(55, 78, 77, 0.14);
        --line-strong: rgba(55, 78, 77, 0.3);
        --text: #253738;
        --text-soft: #5f7370;
        --accent: #4f7784;
        --accent-strong: #284f5d;
        --shadow: 0 24px 58px rgba(53, 73, 70, 0.13);
        color-scheme: light;
      }

      body {
        background:
          radial-gradient(circle at 10% 6%, rgba(108, 143, 128, 0.2), transparent 30%),
          radial-gradient(circle at 90% 16%, rgba(86, 120, 143, 0.18), transparent 32%),
          linear-gradient(145deg, #f1f3ed 0%, #e8ece7 52%, #e0e6e2 100%);
      }

      /*
        L'attribut hidden ne pose qu'un `display: none` de feuille par defaut,
        que la moindre regle `display` de la page ecrase. Le panneau de
        configuration, en `display: grid`, restait donc affiche alors que le
        code le croyait cache.
      */
      [hidden] {
        display: none !important;
      }

      body {
        display: flex;
        justify-content: center;
        padding: max(18px, env(safe-area-inset-top)) 16px
          max(24px, env(safe-area-inset-bottom));
      }

      .dictee {
        display: flex;
        flex-direction: column;
        gap: 22px;
        max-width: 520px;
        width: 100%;
      }

      .dictee-tete {
        display: grid;
        gap: 4px;
      }

      .dictee-tete h1 {
        font-family: var(--content-font);
        font-size: 1.5rem;
        margin: 0;
      }

      .dictee-session,
      .dictee-contexte {
        color: var(--text-soft);
        font-size: 0.82rem;
        margin: 0;
      }

      .dictee-contexte {
        opacity: 0.75;
      }

      /* ---------- le bouton ---------- */

      .dictee-scene {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .dictee-bouton {
        align-items: center;
        aspect-ratio: 1;
        background:
          radial-gradient(circle at 30% 18%, rgba(255, 255, 255, 0.3), transparent 42%),
          linear-gradient(150deg, #4f7784 0%, #234653 100%);
        border: 1px solid rgba(248, 251, 250, 0.3);
        border-radius: 50%;
        box-shadow: var(--shadow);
        color: #f8fbfa;
        cursor: pointer;
        display: flex;
        font-size: 1.02rem;
        font-weight: 700;
        justify-content: center;
        padding: 12px;
        text-align: center;
        transition: transform 120ms ease, opacity 120ms ease;
        width: min(62vw, 224px);
        /* touch-action evite le zoom au double-tap et le defilement qui
           annulerait l'appui maintenu. user-select evite la selection du
           libelle quand le doigt glisse un peu. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .dictee-bouton[disabled] {
        cursor: default;
        opacity: 0.45;
      }

      .dictee-bouton.is-arming {
        opacity: 0.7;
      }

      .dictee-bouton.is-recording {
        background:
          radial-gradient(circle at 30% 18%, rgba(255, 255, 255, 0.3), transparent 42%),
          linear-gradient(150deg, #d8503a 0%, #a32c1c 100%);
        transform: scale(0.97);
        animation: dictee-pulse 1.6s ease-in-out infinite;
      }

      @keyframes dictee-pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(216, 80, 58, 0.42);
        }
        50% {
          box-shadow: 0 0 0 18px rgba(216, 80, 58, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dictee-bouton.is-recording {
          animation: none;
        }
      }

      .dictee-chrono {
        font-size: 2.1rem;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        margin: 0;
      }

      .dictee-niveau {
        background: var(--line);
        border-radius: 999px;
        height: 8px;
        overflow: hidden;
        width: min(100%, 260px);
      }

      .dictee-niveau span {
        background: linear-gradient(90deg, var(--accent), var(--accent-strong));
        border-radius: 999px;
        display: block;
        height: 100%;
        transition: width 90ms linear;
        width: 0%;
      }

      .dictee-statut {
        color: var(--text-soft);
        font-size: 0.85rem;
        margin: 0;
        min-height: 1.2em;
        text-align: center;
      }

      .dictee-statut.is-error {
        color: #d8503a;
      }

      /* ---------- modes ---------- */

      .dictee-modes {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        display: grid;
        gap: 4px;
        grid-template-columns: 1fr 1fr;
        margin: 0 auto;
        padding: 4px;
        width: min(100%, 260px);
      }

      .dictee-mode {
        background: transparent;
        border: none;
        border-radius: 999px;
        color: var(--text-soft);
        cursor: pointer;
        font-size: 0.88rem;
        min-height: 40px;
      }

      .dictee-mode.is-active {
        background: var(--accent);
        color: #f8fbfa;
        font-weight: 600;
      }

      /* ---------- file d'attente ---------- */

      .dictee-file-tete {
        align-items: baseline;
        display: flex;
        gap: 10px;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .dictee-file-tete h2 {
        font-family: var(--content-font);
        font-size: 1.05rem;
        margin: 0;
      }

      .dictee-pastille {
        color: var(--text-soft);
        font-size: 0.78rem;
      }

      .dictee-liste {
        display: grid;
        gap: 10px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .dictee-item {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        display: grid;
        gap: 8px;
        padding: 12px 14px;
      }

      .dictee-item-titre {
        font-weight: 600;
      }

      .dictee-item-meta {
        color: var(--text-soft);
        font-size: 0.78rem;
      }

      .dictee-item-meta .is-interrupted {
        color: #c8892f;
      }

      .dictee-item-actions {
        display: flex;
        gap: 8px;
      }

      .dictee-item-actions button {
        background: transparent;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        color: var(--text);
        cursor: pointer;
        font-size: 0.82rem;
        min-height: 38px;
        padding: 0 14px;
      }

      .dictee-item audio {
        width: 100%;
      }

      .dictee-vide {
        color: var(--text-soft);
        font-size: 0.85rem;
        margin: 0;
      }

      /* ---------- configuration ---------- */

      .dictee-config {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      .dictee-config h2 {
        font-family: var(--content-font);
        font-size: 1rem;
        margin: 0;
      }

      .dictee-config label {
        display: grid;
        font-size: 0.8rem;
        gap: 4px;
      }

      .dictee-config input {
        background: transparent;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        color: var(--text);
        min-height: 44px;
        padding: 0 12px;
        width: 100%;
      }

      .dictee-config button {
        background: var(--accent);
        border: none;
        border-radius: 999px;
        color: #f8fbfa;
        cursor: pointer;
        font-weight: 600;
        min-height: 44px;
        padding: 0 18px;
      }

      .dictee-config .dictee-config-note {
        color: var(--text-soft);
        font-size: 0.78rem;
        margin: 0;
      }

      .dictee-config .dictee-config-note.est-ok {
        color: var(--accent-strong);
        font-weight: 600;
      }

      .dictee-config fieldset {
        border: none;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 12px 0 0;
      }

      .dictee-config legend {
        color: var(--text-soft);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        padding: 0;
        text-transform: uppercase;
      }

      .dictee-config-toggle {
        background: transparent;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        color: var(--text-soft);
        cursor: pointer;
        font-weight: 500;
        justify-self: start;
        min-height: 38px;
        padding: 0 14px;
      }

      /* Ce qui manque se voit sans ouvrir le panneau. */
      .dictee-config-toggle.est-incomplete {
        border-color: var(--accent);
        color: var(--accent-strong);
        font-weight: 600;
      }

      /* ---------- etats d'une ligne de la file ---------- */

      .dictee-etat {
        border-radius: 999px;
        display: inline-block;
        font-size: 0.72rem;
        padding: 2px 10px;
      }

      .dictee-etat.est-attente { background: var(--line); color: var(--text-soft); }
      .dictee-etat.est-cours { background: rgba(79, 119, 132, 0.16); color: var(--accent-strong); }
      .dictee-etat.est-fait { background: rgba(111, 146, 123, 0.22); color: #47705a; }
      .dictee-etat.est-erreur { background: rgba(216, 80, 58, 0.18); color: #d8503a; }

      .dictee-item-transcript {
        border-left: 2px solid var(--line-strong);
        color: var(--text-soft);
        font-size: 0.85rem;
        line-height: 1.5;
        margin: 0;
        padding-left: 10px;
        white-space: pre-wrap;
      }

      .dictee-item-erreur {
        color: #d8503a;
        font-size: 0.78rem;
        margin: 0;
      }

      .dictee-pied {
        border-top: 1px solid var(--line);
        color: var(--text-soft);
        display: grid;
        font-size: 0.8rem;
        gap: 6px;
        padding-top: 16px;
      }

      .dictee-pied a {
        color: var(--accent-strong);
      }

      .dictee-pied p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main class="dictee">
      <header class="dictee-tete">
        <p class="eyebrow">Atlas personnel</p>
        <h1>Dictee</h1>
        <p id="voice-session" class="dictee-session">Session : verification...</p>
        <p id="voice-contexte" class="dictee-contexte"></p>
      </header>

      <section class="dictee-scene">
        <!-- Desactive au depart : voice.js l'active des qu'il a branche
             l'ecoute de l'appui. Mieux vaut un bouton franchement inerte
             pendant quelques millisecondes qu'un bouton qui accepte un appui
             sans rien enregistrer. -->
        <button id="voice-record" class="dictee-bouton" type="button" disabled>
          <span id="voice-record-label">Chargement...</span>
        </button>
        <p id="voice-chrono" class="dictee-chrono">00:00</p>
        <div class="dictee-niveau" aria-hidden="true"><span id="voice-niveau"></span></div>
        <p id="voice-statut" class="dictee-statut" role="status"></p>
      </section>

      <section class="dictee-modes" aria-label="Mode d'enregistrement">
        <button id="voice-mode-hold" class="dictee-mode" type="button" data-voice-mode="hold">
          Maintien
        </button>
        <button id="voice-mode-toggle" class="dictee-mode" type="button" data-voice-mode="toggle">
          Bascule
        </button>
      </section>

      <!-- Le stockage etant cloisonne sur iOS, cette page ne voit ni la cle
           Gemini ni la session d'Atlas : elle a les siennes, saisies une fois.
           Le bloc reste replie des que tout est en place. -->
      <section id="voice-config" class="dictee-config">
        <h2>Configuration</h2>

        <label>
          <span>Cle Gemini</span>
          <input id="voice-gemini-key" type="password" autocomplete="off"
                 placeholder="AIza..." spellcheck="false" />
        </label>
        <label>
          <span>Modele de transcription</span>
          <input id="voice-gemini-model" type="text" autocomplete="off" spellcheck="false" />
        </label>
        <button id="voice-gemini-save" type="button">Enregistrer</button>
        <p id="voice-gemini-status" class="dictee-config-note"></p>

        <fieldset>
          <legend>Session Supabase</legend>
          <label>
            <span>Adresse e-mail</span>
            <input id="voice-auth-email" type="email" autocomplete="username" />
          </label>
          <label>
            <span>Mot de passe</span>
            <input id="voice-auth-password" type="password" autocomplete="current-password" />
          </label>
          <button id="voice-auth-submit" type="button">Se connecter</button>
          <p id="voice-auth-status" class="dictee-config-note"></p>
        </fieldset>
      </section>

      <button id="voice-config-toggle" class="dictee-config-toggle" type="button" hidden>
        Configuration
      </button>

      <section class="dictee-file">
        <div class="dictee-file-tete">
          <h2>En attente</h2>
          <span id="voice-file-resume" class="dictee-pastille"></span>
        </div>
        <ul id="voice-liste" class="dictee-liste"></ul>
        <p id="voice-vide" class="dictee-vide">Aucun enregistrement en attente.</p>
      </section>

      <footer class="dictee-pied">
        <p><a href="./index.html">Ouvrir Atlas</a></p>
        <p>
          L'audio part vers Gemini pour etre transcrit, puis seul le texte
          rejoint Atlas. L'enregistrement est efface une fois depose.
        </p>
      </footer>
    </main>

    <script src="./scripts/config.js?v=108"></script>
    <script src="./scripts/auth.js?v=108"></script>
    <script src="./scripts/voice-send.js?v=108"></script>
    <script src="./scripts/voice.js?v=108"></script>
  </body>
</html>
